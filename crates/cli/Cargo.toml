[package]
name = "rs-immicher-oxide"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line Immich media transcoding pipeline for AV1 video and JPEG XL images."
documentation = "https://docs.rs/rs-immicher-oxide"
readme = "README.md"
keywords = ["immich", "av1", "jxl", "transcode"]
categories = ["command-line-utilities", "multimedia::images", "multimedia::video"]
include = ["Cargo.toml", "README.md", "src/**"]

[[bin]]
name = "rs-immicher-oxide"
path = "src/main.rs"

[dependencies]
rs-immicher-oxide-core = { version = "0.1.0", path = "../core" }
rs-immicher-oxide-codec-jxl = { version = "0.1.0", path = "../codec-jxl" }
rs-immicher-oxide-codec-av1 = { version = "0.1.0", path = "../codec-av1" }
rs-immicher-oxide-backend-immich = { version = "0.1.0", path = "../backend-immich" }

clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
async-trait = "0.1"

[dev-dependencies]
tempfile = "3"
