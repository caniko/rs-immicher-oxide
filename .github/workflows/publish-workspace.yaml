# Generated by simit. Manual edits will be reported as ci=drift.
# Credential-free signed-tag build. Rerun the original signed-tag run for recovery.
name: Build Workspace Crates

# GitHub crates.io publishers run only on signed semver tag pushes. Retry the original run rather than dispatching a branch.
on:
  push:
    tags:
      - "[0-9]*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NIX_CONFIG: "experimental-features = nix-command flakes"
      XDG_CACHE_HOME: "/tmp/.cache"
      CARGO_HOME: "/tmp/.cargo"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Configure GitHub input transport
        run: |
          git config --global --add url.https://github.com/.insteadOf ssh://git@github.com/
          git config --global --add url.https://github.com/.insteadOf git@github.com:

      - name: Validate signed release tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME:-${FORGE_REF_NAME:-${CODEBERG_REF_NAME:-}}}"
          if [ -z "$tag" ]; then
            ref="${GITHUB_REF:-${FORGE_REF:-${CODEBERG_REF:-}}}"
            tag="${ref#refs/tags/}"
          fi

          if ! printf '%s\n' "$tag" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag must be an exact semver version like 0.1.1, got '$tag'" >&2
            exit 1
          fi
          if ! command -v gpg >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update
              apt-get install -y --no-install-recommends gnupg
            else
              echo "gpg is required to verify signed release tags" >&2
              exit 1
            fi
          fi
          git_fetch() {
            if [ -n "${GITHUB_TOKEN:-}" ]; then
              auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
              git -c "http.extraHeader=$auth_header" fetch "$@"
            else
              git fetch "$@"
            fi
          }
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          trap 'rm -rf "$GNUPGHOME"' EXIT
          chmod 700 "$GNUPGHOME"
          # The release checkout cannot supply its own verification key.
          # Fetch the repository's independently maintained default-branch key.
          git_fetch --no-tags origin HEAD
          git show "FETCH_HEAD:keys/maintainers.gpg" > "$GNUPGHOME/maintainers.gpg"
          test -s "$GNUPGHOME/maintainers.gpg"
          gpg --batch --import "$GNUPGHOME/maintainers.gpg"

          git_fetch --force --tags origin "refs/tags/${tag}:refs/tags/${tag}"
          git verify-tag "$tag"
          signed_tag_name="$(git cat-file tag "refs/tags/$tag" | sed -n '1,/^$/s/^tag //p')"
          test "$signed_tag_name" = "$tag" || { echo 'Signed tag object name differs from the release label' >&2; exit 1; }
          validated_sha="$(git rev-parse --verify "refs/tags/${tag}^{commit}")"
          checkout_sha="$(git rev-parse --verify HEAD)"
          if [ "$validated_sha" != "$checkout_sha" ]; then
            echo "Signed tag commit does not match the checkout being published" >&2
            exit 1
          fi

      - name: Test rs-immicher-oxide-core
        run: nix develop -c cargo test --locked -p rs-immicher-oxide-core --all-targets --all-features
      - name: Clippy rs-immicher-oxide-core
        run: nix develop -c cargo clippy --locked -p rs-immicher-oxide-core --all-targets --all-features -- -D warnings
      - name: Document rs-immicher-oxide-core
        run: nix develop -c cargo doc --locked -p rs-immicher-oxide-core --no-deps --all-features
      - name: Test rs-immicher-oxide-backend-immich
        run: nix develop -c cargo test --locked -p rs-immicher-oxide-backend-immich --all-targets --all-features
      - name: Clippy rs-immicher-oxide-backend-immich
        run: nix develop -c cargo clippy --locked -p rs-immicher-oxide-backend-immich --all-targets --all-features -- -D warnings
      - name: Document rs-immicher-oxide-backend-immich
        run: nix develop -c cargo doc --locked -p rs-immicher-oxide-backend-immich --no-deps --all-features
      - name: Test rs-immicher-oxide-codec-av1
        run: nix develop -c cargo test --locked -p rs-immicher-oxide-codec-av1 --all-targets --all-features
      - name: Clippy rs-immicher-oxide-codec-av1
        run: nix develop -c cargo clippy --locked -p rs-immicher-oxide-codec-av1 --all-targets --all-features -- -D warnings
      - name: Document rs-immicher-oxide-codec-av1
        run: nix develop -c cargo doc --locked -p rs-immicher-oxide-codec-av1 --no-deps --all-features
      - name: Test rs-immicher-oxide-codec-jxl
        run: nix develop -c cargo test --locked -p rs-immicher-oxide-codec-jxl --all-targets --all-features
      - name: Clippy rs-immicher-oxide-codec-jxl
        run: nix develop -c cargo clippy --locked -p rs-immicher-oxide-codec-jxl --all-targets --all-features -- -D warnings
      - name: Document rs-immicher-oxide-codec-jxl
        run: nix develop -c cargo doc --locked -p rs-immicher-oxide-codec-jxl --no-deps --all-features
      - name: Test rs-immicher-oxide
        run: nix develop -c cargo test --locked -p rs-immicher-oxide --all-targets --all-features
      - name: Clippy rs-immicher-oxide
        run: nix develop -c cargo clippy --locked -p rs-immicher-oxide --all-targets --all-features -- -D warnings
      - name: Document rs-immicher-oxide
        run: nix develop -c cargo doc --locked -p rs-immicher-oxide --no-deps --all-features
      - name: Package coordinated release set
        run: nix develop -c cargo package --locked --allow-dirty --no-verify -p rs-immicher-oxide-core -p rs-immicher-oxide-backend-immich -p rs-immicher-oxide-codec-av1 -p rs-immicher-oxide-codec-jxl -p rs-immicher-oxide --target-dir "$RUNNER_TEMP/simit-package-target"
      - name: Build immutable archive rs-immicher-oxide-core
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          test "$(nix develop -c cargo pkgid --locked -p rs-immicher-oxide-core | awk -F'[#@]' 'NF > 1 {print $NF}' | tail -n 1)" = "$version"
          mkdir -p "$RUNNER_TEMP/simit-crates/rs-immicher-oxide-core"
          cp "$RUNNER_TEMP/simit-package-target/package/rs-immicher-oxide-core-$version.crate" "$RUNNER_TEMP/simit-crates/rs-immicher-oxide-core/"
      - name: Retain original-run archive rs-immicher-oxide-core
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simit-crate-rs-immicher-oxide-core-${{ github.run_attempt }}
          path: ${{ runner.temp }}/simit-crates/rs-immicher-oxide-core/*.crate
          if-no-files-found: error
          retention-days: 30

      - name: Build immutable archive rs-immicher-oxide-backend-immich
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          test "$(nix develop -c cargo pkgid --locked -p rs-immicher-oxide-backend-immich | awk -F'[#@]' 'NF > 1 {print $NF}' | tail -n 1)" = "$version"
          mkdir -p "$RUNNER_TEMP/simit-crates/rs-immicher-oxide-backend-immich"
          cp "$RUNNER_TEMP/simit-package-target/package/rs-immicher-oxide-backend-immich-$version.crate" "$RUNNER_TEMP/simit-crates/rs-immicher-oxide-backend-immich/"
      - name: Retain original-run archive rs-immicher-oxide-backend-immich
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simit-crate-rs-immicher-oxide-backend-immich-${{ github.run_attempt }}
          path: ${{ runner.temp }}/simit-crates/rs-immicher-oxide-backend-immich/*.crate
          if-no-files-found: error
          retention-days: 30

      - name: Build immutable archive rs-immicher-oxide-codec-av1
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          test "$(nix develop -c cargo pkgid --locked -p rs-immicher-oxide-codec-av1 | awk -F'[#@]' 'NF > 1 {print $NF}' | tail -n 1)" = "$version"
          mkdir -p "$RUNNER_TEMP/simit-crates/rs-immicher-oxide-codec-av1"
          cp "$RUNNER_TEMP/simit-package-target/package/rs-immicher-oxide-codec-av1-$version.crate" "$RUNNER_TEMP/simit-crates/rs-immicher-oxide-codec-av1/"
      - name: Retain original-run archive rs-immicher-oxide-codec-av1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simit-crate-rs-immicher-oxide-codec-av1-${{ github.run_attempt }}
          path: ${{ runner.temp }}/simit-crates/rs-immicher-oxide-codec-av1/*.crate
          if-no-files-found: error
          retention-days: 30

      - name: Build immutable archive rs-immicher-oxide-codec-jxl
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          test "$(nix develop -c cargo pkgid --locked -p rs-immicher-oxide-codec-jxl | awk -F'[#@]' 'NF > 1 {print $NF}' | tail -n 1)" = "$version"
          mkdir -p "$RUNNER_TEMP/simit-crates/rs-immicher-oxide-codec-jxl"
          cp "$RUNNER_TEMP/simit-package-target/package/rs-immicher-oxide-codec-jxl-$version.crate" "$RUNNER_TEMP/simit-crates/rs-immicher-oxide-codec-jxl/"
      - name: Retain original-run archive rs-immicher-oxide-codec-jxl
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simit-crate-rs-immicher-oxide-codec-jxl-${{ github.run_attempt }}
