          test "$(nix develop -c cargo pkgid --locked -p rs-immicher-oxide | awk -F'[#@]' 'NF > 1 {print $NF}' | tail -n 1)" = "$version"
          mkdir -p "$RUNNER_TEMP/simit-crates/rs-immicher-oxide"
          cp "$RUNNER_TEMP/simit-package-target/package/rs-immicher-oxide-$version.crate" "$RUNNER_TEMP/simit-crates/rs-immicher-oxide/"
      - name: Retain original-run archive rs-immicher-oxide
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
