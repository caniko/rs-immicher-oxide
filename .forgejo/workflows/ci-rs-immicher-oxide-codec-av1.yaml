# Generated by simit. Manual edits will be reported as ci=drift.
name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: atlas-nix-trusted
    env:
      NIX_CONFIG: "experimental-features = nix-command flakes"
      XDG_CACHE_HOME: "/tmp/.cache"
      CARGO_HOME: "/tmp/.cargo"
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Add cargo bin to PATH
        run: echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Check flake
        run: nix flake check

      - name: Test
        run: nix develop -c cargo test -p rs-immicher-oxide-codec-av1

      - name: Build docs
        run: nix develop -c cargo doc -p rs-immicher-oxide-codec-av1 --no-deps --all-features

      - name: Clippy
        run: nix develop -c cargo clippy -p rs-immicher-oxide-codec-av1 --all-targets -- --deny warnings

      - name: Package crate
        run: nix develop -c cargo package -p rs-immicher-oxide-codec-av1 --allow-dirty --list
